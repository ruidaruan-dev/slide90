name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install renderer dependencies
        run: npm ci
      - name: Validate repository
        run: python scripts/validate_repo.py
      - name: Run tests
        run: |
          npm test
          python -m unittest discover -s tests
      - name: Verify P0 delivery gate
        run: SLIDE90_P0_REPORT=/tmp/p0-verification.json npm run verify:p0
      - name: Verify editable layouts and repair loop
        run: SLIDE90_P1_REPORT=/tmp/p1-verification.json npm run verify:p1
      - name: Verify project-reporting layouts
        run: SLIDE90_PROJECT_REPORT=/tmp/project-verification.json npm run verify:project
      - name: Build skill package
        run: python scripts/package_skill.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: slide90-skill
          path: dist/slide90.skill.zip
