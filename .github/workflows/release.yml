name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: python scripts/validate_repo.py
      - run: |
          npm test
          python -m unittest discover -s tests
      - run: SLIDE90_P0_REPORT=/tmp/p0-verification.json npm run verify:p0
      - run: python scripts/package_skill.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/slide90.skill.zip --generate-notes
