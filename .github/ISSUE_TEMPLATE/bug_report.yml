name: Bug report
description: Report a reproducible skill, installer, or layout issue
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Codex, Claude Code, Cursor, Gemini CLI, WorkBuddy, Other]
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Prompt or task
      description: Use synthetic or redacted content only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed confidential data, watermarks, names, and internal metrics.
          required: true
